name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check src tests bin/claude-launcher bin/claude-session-hook.py libexec/claude-launcher-core
      - run: uvx ruff format --check src tests bin/claude-launcher bin/claude-session-hook.py libexec/claude-launcher-core
      - run: shellcheck bin/claude-session-hook install.sh tests/docker/run.sh tests/docker/*/*.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # the oldest the launcher runs on
      - run: python -m pip install pytest pyte
      - name: fzf, fetched as install.ps1 would
        shell: pwsh
        run: |
          $fzf = python libexec/claude-launcher-core install fetch-fzf
          Add-Content $env:GITHUB_PATH (Split-Path $fzf)
      # A short temp directory keeps the deepest test paths under 260 characters.
      - run: python -m pytest -q -p no:cacheprovider --basetemp=C:\t

  distro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:22.04, ubuntu:24.04, ubuntu:26.04, debian:12, debian:13, fedora:42, fedora:43, archlinux:latest]
    steps:
      - uses: actions/checkout@v4
      - run: tests/docker/run.sh distro ${{ matrix.image }}

  terminals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/docker/run.sh terminals
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terminals-logs
          path: tests/docker/.work/

  systemd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/docker/run.sh systemd
      - if: failure()
        run: cat tests/docker/.work/systemd-*.log
